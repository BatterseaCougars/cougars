name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# No secrets here: the site builds from fallback content without Sanity.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm test
      - run: npm run check -w @cougars/web
      # The team app's pages (svelte-check) and its Worker (tsc)
      - run: npm run check -w @cougars/team
      - run: npm run build
      - run: npm run build -w @cougars/team
      - run: npm run build -w @cougars/studio
