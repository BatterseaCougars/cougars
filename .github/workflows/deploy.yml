name: Deploy

# Two environments on two Cloudflare accounts (docs/adr/0010-two-environments.md):
# main            -> production: worker `cougars`, Cougars account
# sanity-publish  -> production rebuild after an editor publishes in the Studio
# pull request    -> dev: a preview version of `cougars-dev`, Cougars Dev account, commented on the PR
# Each GitHub environment holds its own BWS_ACCESS_TOKEN: `production` (main only) can read
# production secrets; `preview` holds the dev token, which can't.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Forks don't get secrets; their PRs are covered by pr.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      SITE_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'production' }}
      SITE_URL: ${{ github.event_name != 'pull_request' && vars.SITE_URL || '' }}
      # Dev builds: sample content where Sanity's dev dataset is empty, and noindex
      DEMO_CONTENT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Bitwarden Secrets Manager CLI
        run: |
          curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
          sudo unzip -o /tmp/bws.zip -d /usr/local/bin

      - name: Load secrets from Bitwarden
        run: node scripts/env-pull.mjs --github-env --environment "$SITE_ENV"
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

      - name: Build version
        run: echo "PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d)+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # Worker name, D1 database and SITE_ENV for this environment (creates the database once)
      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV"

      # Each environment has its own database, so a PR migrates dev, never production.
      # Keep migrations additive (db/README.md).
      - name: Apply D1 migrations
        working-directory: apps/web
        # D1 commands don't follow the build's config redirect, so name the generated config
        run: npx wrangler d1 migrations apply DB --remote -c dist/server/wrangler.json

      - name: Deploy production
        id: production
        if: env.SITE_ENV == 'production'
        working-directory: apps/web
        run: |
          out=$(npx wrangler deploy --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1)
          echo "url=${SITE_URL:-$url}" >> "$GITHUB_OUTPUT"

      - name: Upload preview
        id: preview
        if: env.SITE_ENV == 'dev'
        working-directory: apps/web
        run: |
          out=$(npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: node scripts/ci/smoke-test.mjs "${{ steps.preview.outputs.url || steps.production.outputs.url }}" "$PUBLIC_BUILD_VERSION"

      - name: Comment preview URL
        if: steps.preview.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: "Preview: ${{ steps.preview.outputs.url }} (`${{ env.PUBLIC_BUILD_VERSION }}`)"
