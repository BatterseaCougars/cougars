name: Deploy

# Branches map to environments like Ark (docs/adr/0013-main-deploys-dev.md), each on its own Cloudflare account
# (docs/adr/0010-two-environments.md):
# pull request    -> dev: a preview version of `cougars-dev`, commented on the PR
# main            -> dev: worker `cougars-dev`, Cougars Dev account
# release         -> production: worker `cougars`, Cougars account
# sanity-publish  -> production rebuild when content changes (from the team app, roadmap M6; ADR 0018)
# schedule        -> daily production rebuild, so Studio changes go live (docs/adr/0018)
# Those two run on the default branch, which the `production` environment refuses, so their only job
# (`rebuild`) starts this workflow again on `release`, where the real production deploy runs.
# GitHub environment `production` (release only) holds BWS_ACCESS_TOKEN__PRODUCTION; `preview` holds
# BWS_ACCESS_TOKEN__DEV, which can't read production secrets.
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: "30 4 * * *" # daily, 04:30 UTC
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || github.ref == 'refs/heads/release' && 'production' || (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'rebuild' || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # A Studio publish or the daily schedule: deploy what's live by running this workflow on `release`.
  rebuild:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild production from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/release" --silent 2>/dev/null; then
            gh workflow run deploy.yml --repo "${{ github.repository }}" --ref release
          else
            echo "No release branch yet: nothing is live, nothing to rebuild."
          fi

  deploy:
    # Forks don't get secrets; their PRs are covered by pr.yml. Rebuild triggers only start `rebuild`.
    if: >-
      github.event_name != 'repository_dispatch' && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/release' && 'production' || 'preview' }}
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/release' && 'production' || 'dev' }}
      # Production's address; target.mjs attaches it to the worker. Dev stays on workers.dev (a separate account).
      SITE_URL: ${{ github.ref == 'refs/heads/release' && 'https://batterseacougars.com' || '' }}
      # Dev: sample content where Sanity's dev dataset is empty, and noindex. Production too while the
      # `production` environment's variable DEMO_CONTENT is `true` (until real content is in Sanity).
      DEMO_CONTENT: ${{ github.ref == 'refs/heads/release' && (vars.DEMO_CONTENT || 'false') || 'true' }}
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Bitwarden Secrets Manager CLI
        run: |
          curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
          sudo unzip -o /tmp/bws.zip -d /usr/local/bin

      - name: Load secrets from Bitwarden
        run: node scripts/env-pull.mjs --github-env --environment "$SITE_ENV"
        env:
          # Each GitHub environment holds only its own: BWS_ACCESS_TOKEN__PRODUCTION or BWS_ACCESS_TOKEN__DEV
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION || secrets.BWS_ACCESS_TOKEN__DEV }}

      # Dev (no domain of its own) lives at <worker>.<account subdomain>.workers.dev
      - name: Site URL
        if: env.SITE_URL == ''
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          worker=${{ env.SITE_ENV == 'production' && 'cougars' || 'cougars-dev' }}
          echo "SITE_URL=https://$worker.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Build version
        run: echo "PUBLIC_BUILD_VERSION=$(date -u +%Y.%m.%d)+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The roster is a snapshot of this environment's D1 (scripts/club-snapshot.mjs, apps/web's prebuild, ADR 0043).
      - name: Build
        run: npm run build
        env:
          CLUB_SNAPSHOT_ENV: ${{ env.SITE_ENV }}

      # Worker name, D1 database and SITE_ENV for this environment (creates the database once)
      - name: Target ${{ env.SITE_ENV }}
        run: node scripts/ci/target.mjs "$SITE_ENV"

      # Each environment has its own database, so a PR migrates dev, never production.
      # Keep migrations additive (db/README.md).
      - name: Apply D1 migrations
        working-directory: apps/web
        # D1 commands don't follow the build's config redirect, so name the generated config
        run: npx wrangler d1 migrations apply DB --remote -c dist/server/wrangler.json

      # The team roster: personal data, so it lives in Secrets Manager (TEAM_ROSTER), never in this public repo
      # (ADR 0033). Adds players who aren't there yet and changes no one, so it's safe on every deploy.
      - name: Seed the team roster
        working-directory: apps/web
        run: node ../../scripts/seed-roster.mjs --remote -c dist/server/wrangler.json

      # The privacy page promises enquiries are deleted after 12 months (unless the person joined). Production
      # deploys daily, so this runs daily there.
      - name: Delete expired enquiries
        working-directory: apps/web
        run: npx wrangler d1 execute DB --remote --file ../../db/retention/expire-enquiries.sql -c dist/server/wrangler.json

      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: |
          out=$(npx wrangler deploy --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1)
          echo "url=${SITE_URL:-$url}" >> "$GITHUB_OUTPUT"

      # Secrets the Worker reads at request time: the live video list (ADR 0019). PR previews share dev's.
      # Secrets the Worker reads at request time, from this environment's Secrets Manager project (README#secrets).
      # One that isn't there yet is skipped: the site does without (no live YouTube; emails logged, not sent; no auto-replies).
      - name: Worker secrets
        if: github.event_name != 'pull_request'
        working-directory: apps/web
        run: |
          for name in YOUTUBE_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN TURNSTILE_SECRET_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" -c dist/server/wrangler.json
            else
              echo "$name: not in Secrets Manager for $SITE_ENV, skipped"
            fi
          done

      - name: Upload preview
        id: preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          out=$(npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "$PUBLIC_BUILD_VERSION" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: node scripts/ci/smoke-test.mjs "${{ steps.preview.outputs.url || steps.deploy.outputs.url }}" "$PUBLIC_BUILD_VERSION"

      - name: Comment preview URL
        if: steps.preview.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: "Preview: ${{ steps.preview.outputs.url }} (`${{ env.PUBLIC_BUILD_VERSION }}`)"

  # The Studio (https://battersea-cougars.sanity.studio) ships with production: on push to `release` only
  # (docs/adr/0013-main-deploys-dev.md). One Studio edits both datasets, so there's no dev Studio to deploy.
  studio:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    env:
      BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Bitwarden Secrets Manager CLI
        run: |
          curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
          sudo unzip -o /tmp/bws.zip -d /usr/local/bin

      - name: Load secrets from Bitwarden
        run: node scripts/env-pull.mjs --github-env --environment production
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN__PRODUCTION }}

      # SANITY_DEPLOY_TOKEN, not SANITY_STUDIO_*: the Studio build bundles SANITY_STUDIO_* variables into the
      # public JavaScript.
      - name: Deploy Studio
        run: npm run deploy -w @cougars/studio -- --yes
        env:
          # The live project (shared/sanity.ts, ADR 0017)
          SANITY_STUDIO_SITE_ENV: production
          SANITY_AUTH_TOKEN: ${{ env.SANITY_DEPLOY_TOKEN }}
