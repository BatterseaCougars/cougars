name: Secrets
description: Install the Bitwarden Secrets Manager CLI and load one environment's secrets into the job (ADR 0002)
inputs:
  environment:
    description: production or dev
    required: true
  token:
    description: That environment's Bitwarden token (BWS_ACCESS_TOKEN__PRODUCTION or BWS_ACCESS_TOKEN__DEV)
    required: true
runs:
  using: composite
  steps:
    - name: Install Bitwarden Secrets Manager CLI
      shell: bash
      # It handles the token that unlocks every secret, so it's checked against the release's published checksum
      # before it runs (bws-sha256-checksums-2.1.0.txt). A new version means a new checksum here.
      run: |
        curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
        echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/bws.zip" | sha256sum --check --strict
        sudo unzip -o /tmp/bws.zip -d /usr/local/bin

    - name: Load secrets from Bitwarden
      shell: bash
      run: node scripts/env-pull.mjs --github-env --environment "${{ inputs.environment }}"
      env:
        BWS_ACCESS_TOKEN: ${{ inputs.token }}
